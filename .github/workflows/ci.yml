name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GUARD_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/guard?sslmode=disable
  GUARD_TEST_REDIS_ADDR: localhost:6379

jobs:
  static:
    name: static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go mod verify
        run: go mod verify
      - name: gofmt
        run: |
          # Skip files guarded by adminui_* build tags (feature stubs).
          files=$(git ls-files '*.go' | xargs grep -L '^//go:build adminui_' || true)
          diff=$(gofmt -l $files)
          if [ -n "$diff" ]; then echo "gofmt needed:"; echo "$diff"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - name: govulncheck
        # setup-go installs the go.mod "go" line (1.26.0), and "go run tool@version"
        # runs outside this module, so the "toolchain" directive never applies and
        # the scan reports every fix released in the patch releases since .0. Scan
        # with the toolchain the module actually pins, read from go.mod so the
        # version stays defined in one place.
        run: |
          toolchain=$(awk '/^toolchain /{print $2}' go.mod)
          echo "scanning with ${toolchain:-the default toolchain}"
          GOTOOLCHAIN=$toolchain go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  adapters:
    name: framework adapters
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        adapter: [nethttp, echo, fiber, iris, hertz, beego]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Adapters are separate modules resolved through go.work, so they build
      # against this commit rather than the last published tag.
      - name: test
        run: go test -count=1 ./adapters/${{ matrix.adapter }}/
      # Each adapter pulls in a whole web framework of its own, and the static
      # checks job scans only the root module, so without this their dependency
      # trees are never checked. GOWORK=off keeps the scan on the module's own
      # resolved versions, the ones a user installing it would get.
      - name: govulncheck
        working-directory: adapters/${{ matrix.adapter }}
        run: |
          toolchain=$(awk '/^toolchain /{print $2}' ../../go.mod)
          GOWORK=off GOTOOLCHAIN=$toolchain go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  test:
    name: test (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres: ["13", "17"]   # 13 = minimum supported
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: guard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d guard"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race
        run: |
          pkgs=$(go list ./... | grep -v '/examples/')
          go test -count=1 -race -covermode=atomic -coverprofile=coverage.out $pkgs
      - name: coverage gate (every package 100.0%)
        if: matrix.postgres == '17'
        run: bash scripts/coverage-gate.sh coverage.out 100.0
      - uses: actions/upload-artifact@v4
        if: always() && matrix.postgres == '17'
        with:
          name: coverage
          path: coverage.out

  examples:
    name: build examples
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: CGO_ENABLED=0 go build -trimpath ./examples/...
      - name: docker build example
        run: docker build -f examples/gin/Dockerfile -t guard-example:ci .
