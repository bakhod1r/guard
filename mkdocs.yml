site_name: Guard
site_description: Enterprise-grade authorization and API security platform for Go.
site_url: https://bakhod1r.github.io/guard/
repo_url: https://github.com/bakhod1r/guard
repo_name: bakhod1r/guard
edit_uri: edit/main/docs/
copyright: MIT licensed

docs_dir: docs

theme:
  name: material
  logo: assets/banner.png
  favicon: assets/banner.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started:
      - Quick start: quick-start.md
      - Configuration: configuration.md
      - Frameworks: frameworks.md
  - Reference:
      - HTTP API: api.md
      - Admin panel: admin-panel.md
      - Architecture: architecture.md
  - Operations:
      - Production checklist: production.md
      - Security policy: security.md
      - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bakhod1r/guard
