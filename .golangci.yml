version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - revive
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - noctx
    - misspell
  settings:
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unreachable-code
        - name: redefines-builtin-id
    staticcheck:
      # Defaults plus: QF1008 (explicit embedded selectors aid readability in fakes),
      # QF1011 (typed `var _ T = x` is an intentional compile-time assertion).
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1008", "-QF1011"]
  exclusions:
    generated: lax
    rules:
      # Test fixtures deliberately use weak/fake credentials and unchecked helpers.
      - path: _test\.go
        linters: [gosec, errcheck, noctx, bodyclose]

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - adminui/stubs_.*\.go
