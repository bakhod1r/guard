{{define "content"}}
<div class="bar"><h1>Dashboard</h1></div>
<div class="card">
  <p>Welcome, <strong>{{.User.Email}}</strong>.</p>
  <p class="mute">Roles: {{range .Data.Roles}}<span class="badge">{{.}}</span>{{else}}none{{end}}</p>
</div>
<div class="grid">
  {{range .Data.Stats}}
  <a class="card stat" data-stat="{{.Key}}" href="{{$.Base}}{{.Href}}" style="text-decoration:none;color:inherit">
    <span class="mute">{{.Label}}</span>
    {{if .Err}}<span class="badge bad" role="alert">{{.Err}}</span>{{else}}<b>{{.Value}}</b>{{end}}
  </a>
  {{end}}
</div>
{{end}}
