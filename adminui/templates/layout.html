<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{.Title}} · Guard</title>
<style nonce="{{.Nonce}}">
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--mute:#667085;--line:#e4e7ec;--acc:#4f46e5;--acc-ink:#fff;--bad:#d92d20;--bad-bg:#fef3f2;--ok:#067647;--ok-bg:#ecfdf3}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--ink:#e6e8ec;--mute:#98a2b3;--line:#2a2f3a;--acc:#818cf8;--acc-ink:#0f1115;--bad:#f97066;--bad-bg:#2a1414;--ok:#47cd89;--ok-bg:#0f2a1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--acc)}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);background:var(--card);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.brand{font-weight:700;padding:4px 10px 14px}
.side a{display:block;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none}
.side a:hover{background:color-mix(in srgb,var(--acc) 8%,transparent)}
.side a.on{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);font-weight:600}
.who{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);color:var(--mute);font-size:13px;word-break:break-all}
main{padding:24px 16px;min-width:0;max-width:1100px}
h1{font-size:20px;margin:0 0 16px}
h2{font-size:15px;margin:24px 0 8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.bar h1{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500;white-space:nowrap}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line);margin:1px 2px 1px 0;white-space:nowrap}
.badge.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.badge.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.btn{display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:13px}
form.inline{display:inline}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:13px;min-height:160px}
.field{margin-bottom:12px}
.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.row>*{flex:1 1 160px}.row>.btn{flex:0 0 auto}
.flash{padding:10px 12px;border-radius:8px;margin-bottom:16px;background:var(--ok-bg);color:var(--ok)}
.flash.err{background:var(--bad-bg);color:var(--bad)}
.mute{color:var(--mute)}
.empty{color:var(--mute);padding:28px;text-align:center}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all}
.stat b{display:block;font-size:24px}
.mt0{margin-top:0}.m0{margin:0}.mt8{margin-top:8px}.bare{border:0;padding:0;margin:0}.check{display:flex;gap:8px;align-items:center;margin-top:24px}input.auto{width:auto}.left{text-align:left;padding-bottom:8px}.nowrap{white-space:nowrap}textarea.short{min-height:80px}.row.between{justify-content:space-between}a.plain{text-decoration:none;color:inherit}.auth{margin:10vh auto;max-width:380px}
@media (max-width:720px){.shell{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.brand{width:100%;padding-bottom:6px}.who{width:100%;margin-top:8px}}
</style>
</head>
<body>
{{if .User}}
<div class="shell">
  <nav class="side" aria-label="Admin">
    <div class="brand">Guard admin</div>
    {{range .Nav}}<a href="{{.Href}}" class="{{if eq .Key $.Active}}on{{end}}">{{.Label}}</a>{{end}}
    <div class="who">{{.User.Email}}
      <form method="post" action="{{.Base}}/logout" class="mt8"><input type="hidden" name="_csrf" value="{{.CSRF}}"><button class="btn sm">Sign out</button></form>
    </div>
  </nav>
  <main>
    {{if .Flash}}<div class="flash" role="status">{{.Flash}}</div>{{end}}
    {{if .Error}}<div class="flash err" role="alert">{{.Error}}</div>{{end}}
    {{template "content" .}}
  </main>
</div>
{{else}}
<main class="auth">
  {{if .Error}}<div class="flash err" role="alert">{{.Error}}</div>{{end}}
  {{template "content" .}}
</main>
{{end}}
<script nonce="{{.Nonce}}">
document.addEventListener("submit",function(e){var m=e.target.getAttribute("data-confirm");if(m&&!window.confirm(m)){e.preventDefault()}});
document.addEventListener("focusin",function(e){if(e.target.hasAttribute("data-select")){e.target.select()}});
document.addEventListener("click",function(e){var b=e.target.closest("[data-copy]");if(!b){return}var i=document.getElementById(b.getAttribute("data-copy"));i.select();if(navigator.clipboard){navigator.clipboard.writeText(i.value)}b.textContent="Copied"});
(function(){var f=document.getElementById("p-fmt");if(!f){return}f.addEventListener("click",function(){var t=document.getElementById("p-root"),e=document.getElementById("p-fmt-err");if(!t.value.trim()){e.textContent="";return}try{t.value=JSON.stringify(JSON.parse(t.value),null,2);e.textContent=""}catch(x){e.textContent=x.message}})})();
</script>
</body>
</html>
